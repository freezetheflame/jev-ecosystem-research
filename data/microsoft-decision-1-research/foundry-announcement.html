techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTYyNzQyLTRsbUxwRQ?revision=22" data-next-head=""/><meta property="og:image:width" content="1300" data-next-head=""/><meta property="og:image:height" content="500" data-next-head=""/><meta property="og:site_name" content="TECHCOMMUNITY.MICROSOFT.COM" data-next-head=""/><link rel="canonical" href="https://techcommunity.microsoft.com/blog/azure-ai-foundry-blog/introducing-microsoft-decision-1-in-microsoft-foundry-for-decision-and-classific/4562742" data-next-head=""/><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":"https://techcommunity.microsoft.com","name":"Microsoft Community Hub"},{"@type":"ListItem","position":2,"item":"https://techcommunity.microsoft.com/category/communities","name":"Communities"},{"@type":"ListItem","position":3,"item":"https://techcommunity.microsoft.com/category/products-services","name":"Products"},{"@type":"ListItem","position":4,"item":"https://techcommunity.microsoft.com/category/azure-ai-foundry","name":"Microsoft Foundry"},{"@type":"ListItem","position":5,"item":"https://techcommunity.microsoft.com/category/azure-ai-foundry/blog/azure-ai-foundry-blog","name":"Microsoft Foundry Blog"}]}</script><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"BlogPosting","datePublished":"10/9/2026, 6:40:54 PM","description":"Not every step in an AI application needs a large language model to generate a response. Many high-volume application steps are decisions: classify an input, select an option, assign a score, verify a condition, prioritize an item, or control a workflow. To suit these tasks, a new class of models have been developed to address these fast, structured, requests.\nWe are excited to be adding Microsoft-Decision-1 to the Foundry Models Catalog. Our newest, decision model for applications that need to choose among predefined options rather than generate open-ended text.\nWhat are decision models?\nAs AI applications mature, the industry is moving beyond the idea that every model interaction needs to result in generated content. Developers are increasingly building systems composed of different models, tools, and application logic, each suited to a different part of the workload. Within those systems, many of the most frequent operations are not generation problems at all. They are decisions about what should happen next.\nDecision models were designed for this emerging layer of the AI stack. Rather than producing an open-ended response, they evaluate a defined set of possibilities and return structured signals that an application can use to take action. That makes them particularly relevant as developers move toward more dynamic AI applications, where models need to work together and applications must continuously determine where requests should go, which actions should be taken, and when additional processing is needed.\nFor developers, this creates an opportunity to be more intentional about where and how different models are used. Instead of relying on a general-purpose generative model for every step, developers can match the model to the task, using generative and reasoning models where their capabilities are needed and decision models for focused, repeatable choices. The result is a more modular approach to AI application design, where generation, reasoning, and decision-making become complementary building blocks for creating intelligent systems.\n\nWhat is Microsoft-Decision-1?\n\nNow available in public preview, Microsoft-Decision-1 is a decision model built on Qwen3.5-9B and designed for applications that need to make fast, structured choices among predefined options. It brings a purpose-built decision capability to the Foundry Models catalog, giving developers another building block for designing AI applications where different steps may benefit from different types of models.\n\nBuilt for predefined decisions. Microsoft-Decision-1 supports use cases such as agent controls, model routing, intent analysis, data labeling, AI judging, incident response routing, data validation, and content classification.\nStructured for application logic. The model produces predefined answers and confidence signals that applications can use to select the next action or route uncertain results for further review.\nDesigned for lower-latency, lower-cost workflows. Microsoft-Decision-1 is intended for simple, repeatable, and time-sensitive decisions that do not require the generative capabilities or extended reasoning of a larger language model.\n\nYou can explore these capabilities in the Foundry Playground. This example below shows Microsoft-Decision-1 checking urgency, selecting a support team, and scoring priority for a customer request.&amp;nbsp;\nMicrosoft-Decision-1 in the Microsoft Foundry playground.\nMicrosoft-Decision-1 represents an area of continued model innovation at Microsoft. The team will rebase future iterations of the model on OpenAI models and Microsoft’s MAI models, bringing together advances from Microsoft’s own model portfolio with a model architecture purpose-built for decision-making. Over time, this work could create opportunities to further explore how Microsoft models can be specialized for the high-volume decisions that sit inside applications and agentic systems.\nFor developers, Microsoft-Decision-1 expands the choices available when building applications and agents with Foundry. Rather than using the same model for every step, developers can combine generative and reasoning models with a decision model and choose the capability that best fits each part of the workflow. That model diversity is increasingly important as AI applications evolve from single-model experiences into systems that coordinate specialized models, tools, and actions.\n\nHow developers are building with Microsoft-Decision-1\n\nEnterprise applications make decisions throughout a workflow: identifying a customer’s intent, selecting a tool, routing an incident or checking whether a response meets specified criteria. For example, a support application could classify a request as a billing question, a technical issue or an account-access problem. An agent could evaluate a proposed response against a quality rubric and determine whether to accept it, revise it or request review.\n\n\n    \nIf the player doesn’t load, open the video in a new window:  Open video \n\n&amp;nbsp;\nThese decisions can sit alongside generative and reasoning steps in the same application. A language model might draft a response, while Microsoft-Decision-1 evaluates it against defined criteria. With Microsoft-Decision-1 in the Foundry catalog, developers can explore decision workloads through the platform they use to discover and deploy models across various scenarios:\n\n\nClassification: Assign inputs to defined categories, such as customer intents or feedback themes.\n\n\nRouting: Select a model, tool, destination or workflow from a set of options.\n\n\nEvaluation and verification: Assess responses or inputs against specified criteria.\n\n\nWorkflow control: Decide whether to continue, retry, stop or send a case for review.\n\n\nA different model for a different kind of workload\nFor developers, decision models introduce a different way to think about optimization. An AI application may make thousands of small choices around a comparatively small number of complex generative or reasoning tasks. Running every one of those steps through the same general-purpose model can overlook an opportunity to optimize the system around the work each step actually needs to perform.\nThat pattern is showing up across Microsoft. Xbox Research used Microsoft-Decision-1 to categorize more than 10,000 pieces of open-ended feedback into researcher-defined themes, reporting quality competitive with GPT-5 while running 80–100 times faster. Other Microsoft teams have also evaluated the model for assessing Copilot response quality and supporting adaptive replanning in Microsoft Discovery.\nThese scenarios matter because they are not simply classification benchmarks. They are examples of decisions embedded inside larger applications. As AI architectures become more modular, developers can consider generation, reasoning, and decision-making as distinct workloads, then select models based on what each step actually requires.\nFor benchmark methodology, measured results and additional examples, read the Command Line blog here.\n\nPutting Microsoft-Decision-1 to work\n\nFor tasks with predefined outcomes, evaluate Microsoft-Decision-1 using representative inputs and the quality, latency and cost requirements of your application. Compare decision accuracy, including ambiguous cases, latency under expected traffic and cost per completed decision. Where confidence estimates inform automation or review thresholds, validate their calibration on your own data.\nStart with a decision in your application: The following Python example shows how to compare support-routing decisions with expected labels and measure request latency. Replace the illustrative messages and category definitions with examples from your own workload.\nBefore running: Deploy Microsoft-Decision-1 in your Microsoft Foundry subscription and configure FOUNDRY_BASE_URL and FOUNDRY_API_KEY. Set FOUNDRY_MODEL to the model or deployment identifier specified in the quickstart. Keep credentials outside the source code. Model requests incur applicable usage charges.\nIntegration note: Confirm the route and authentication header before running it against your deployment.\n#!/usr/bin/env python3\n&quot;&quot;&quot;Classify support requests with Microsoft-Decision-1.&quot;&quot;&quot;\n \nimport json\nimport os\nimport urllib.error\nimport urllib.request\nfrom collections.abc import Mapping\nfrom statistics import median\nfrom time import perf_counter\nfrom typing import Any\n \nfrom azure.identity import DefaultAzureCredential\n \n \nOPTIONS = {\n    &quot;billing&quot;: &quot;Charges, invoices, refunds, or subscription payments&quot;,\n    &quot;technical&quot;: &quot;Software errors, bugs, or integration failures&quot;,\n    &quot;account&quot;: &quot;Sign-in, password, or account-access problems&quot;,\n}\n \nEXAMPLES = [\n    (&quot;I was charged twice.&quot;, &quot;billing&quot;),\n    (&quot;The integration crashes during checkout.&quot;, &quot;technical&quot;),\n    (&quot;I cannot sign in after resetting my password.&quot;, &quot;account&quot;),\n]\n \nAZURE_ENDPOINT = os.environ[&quot;AZURE_ENDPOINT&quot;].rstrip(&quot;/&quot;)\nDEPLOYMENT_NAME = os.environ[&quot;DEPLOYMENT_NAME&quot;]\nTIMEOUT_SECONDS = 60\nTOKEN_SCOPE = &quot;https://cognitiveservices.azure.com/.default&quot;\nCREDENTIAL = DefaultAzureCredential()\n \n \nclass DecisionAPIError(RuntimeError):\n    &quot;&quot;&quot;Raised when the API can&apos;t return a valid classification.&quot;&quot;&quot;\n \n \ndef read_choice(\n    payload: Any,\n    options: Mapping[str, str],\n) -&amp;gt; str:\n    if not isinstance(payload, dict):\n        raise DecisionAPIError(&quot;The API returned an invalid response.&quot;)\n \n    answers = payload.get(&quot;answers&quot;)\n    if not isinstance(answers, dict):\n        raise DecisionAPIError(&quot;The API returned no answers object.&quot;)\n \n    answer = answers.get(&quot;team&quot;)\n    if not isinstance(answer, dict) or answer.get(&quot;type&quot;) != &quot;choice&quot;:\n        raise DecisionAPIError(&quot;The API returned an invalid answer.&quot;)\n \n    choice = answer.get(&quot;choice&quot;)\n    if not isinstance(choice, str) or choice not in options:\n        raise DecisionAPIError(\n            f&quot;The API selected an unsupported team: {choice!r}.&quot;\n        )\n    return choice\n \n \ndef predict(\n    text: str,\n    options: Mapping[str, str],\n) -&amp;gt; str:\n    if not text.strip():\n        raise ValueError(&quot;text must not be empty.&quot;)\n    if len(options) &amp;lt; 2:\n        raise ValueError(&quot;options must contain at least two choices.&quot;)\n \n    body = json.dumps(\n        {\n            &quot;model&quot;: DEPLOYMENT_NAME,\n            &quot;state&quot;: text,\n            &quot;questions&quot;: {\n                &quot;team&quot;: {\n                    &quot;type&quot;: &quot;choice&quot;,\n                    &quot;instructions&quot;: (\n                        &quot;Which team should handle this customer support &quot;\n                        &quot;request? Select exactly one team based on the &quot;\n                        &quot;primary problem.&quot;\n                    ),\n                    &quot;criteria&quot;: dict(options),\n                }\n            },\n        }\n    ).encode(&quot;utf-8&quot;)\n    access_token = CREDENTIAL.get_token(TOKEN_SCOPE).token\n \n    request = urllib.request.Request(\n        f&quot;{AZURE_ENDPOINT}/providers/microsoft/v1/systemone&quot;,\n        data=body,\n        headers={\n            &quot;Authorization&quot;: f&quot;Bearer {access_token}&quot;,\n            &quot;Content-Type&quot;: &quot;application/json&quot;,\n            &quot;Accept&quot;: &quot;application/json&quot;,\n        },\n        method=&quot;POST&quot;,\n    )\n \n    try:\n        with urllib.request.urlopen(\n            request,\n            timeout=TIMEOUT_SECONDS,\n        ) as response:\n            response_body = response.read()\n    except urllib.error.HTTPError as exc:\n        raise DecisionAPIError(\n            f&quot;The API returned HTTP {exc.code}.&quot;\n        ) from exc\n    except urllib.error.URLError as exc:\n        raise DecisionAPIError(\n            f&quot;Couldn&apos;t reach the API: {exc.reason}.&quot;\n        ) from exc\n \n    try:\n        payload = json.loads(response_body)\n    except (json.JSONDecodeError, UnicodeDecodeError) as exc:\n        raise DecisionAPIError(\n            &quot;The API returned invalid JSON.&quot;\n        ) from exc\n    return read_choice(payload, options)\n \n \ndef main() -&amp;gt; None:\n    correct = 0\n    latencies_ms = []\n \n    for text, expected in EXAMPLES:\n        start = perf_counter()\n        predicted = predict(text, OPTIONS)\n        elapsed_ms = (perf_counter() - start) * 1000\n \n        correct += int(predicted == expected)\n        latencies_ms.append(elapsed_ms)\n        print(\n            f&quot;Expected={expected}, predicted={predicted}, &quot;\n            f&quot;latency={elapsed_ms:.1f} ms&quot;\n        )\n \n    accuracy = correct / len(EXAMPLES)\n    print(f&quot;Accuracy: {accuracy:.1%}&quot;)\n    print(\n        &quot;Median request latency: &quot;\n        f&quot;{median(latencies_ms):.1f} ms&quot;\n    )\n \n \nif __name__ == &quot;__main__&quot;:\n    main()\nThis small dataset illustrates the evaluation process. For meaningful results, use a larger, representative labeled dataset and inspect errors by category. The measured latency includes the client call and network time; sequential requests do not measure latency under production load. Assess cost and confidence calibration separately.\nYour application defines the available options and resulting actions. Use evaluation results to determine where automation is appropriate and where additional validation or human review is needed.\nPricing\n\nModel\n\nDeployment Type\n\nInput Tokens (#/1M)\n\nOutput tokens (#/1M)\n\nMicrosoft-Decision-1\n\nUS Datazone\n\n$0.042\n\nN/A\n\nEU Datazone\n\n$0.042\n\nN/A\n\nGet started\nExplore Microsoft-Decision-1 in the Foundry catalog to make your first request. We look forward to seeing how developers use Microsoft-Decision-1 to bring structured decisions into their applications and agents through Microsoft Foundry.","mainEntityOfPage":{"@type":"WebPage","@id":"https://techcommunity.microsoft.com/blog/azure-ai-foundry-blog/introducing-microsoft-decision-1-in-microsoft-foundry-for-decision-and-classific/4562742"},"headline":"Introducing Microsoft-Decision-1 in Microsoft Foundry for decision and classification workloads","image":["https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTYyNzQyLTRsbUxwRQ?revision=22"],"dateModified":"10/9/2026, 9:05:02 PM","author":{"@type":"Person","name":"Saumil-Shrivastava","url":"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/dS0yNDc0NDg4LTk1ZGNLVw?image-coordinates=0%2C0%2C389%2C389"},"publisher":{"@type":"Organization","name":"TECHCOMMUNITY.MICROSOFT.COM"}}</script><noscript id="__next_css__DO_NOT_USE__"></noscript><script id="prism-bootstrap" data-nscript="beforeInteractive" crossorigin="anonymous">window.Prism = window.Prism || {};Prism.manual = true;</script><link rel="preload" href="/_next/static/css/14f49ad65b44554d.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/14f49ad65b44554d.css" crossorigin="anonymous" data-n-g=""/><link rel="preload" href="/_next/static/css/16ca3aa1e91dea46.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/16ca3aa1e91dea46.css" crossorigin="anonymous" data-n-p=""/><link rel="preload" href="/_next/static/css/5ffe639e00adc788.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/5ffe639e00adc788.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/8ed17267209fce19.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/8ed17267209fce19.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/af4f72a0a5873a2a.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/af4f72a0a5873a2a.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/346bd2b192a76232.css" as="style" crossorigin="anonymous"/><link rel="stylesheet" href="/_next/static/css/346bd2b192a76232.css" crossorigin="anonymous"/><link rel="preload" href="/_next/static/css/a75b5a2abdf21079.css" a ied","key":"error.lithium.policies.forums.policy_can_publish_on_edit_workflow_action.accessDenied","args":[]}},"canModerateSpamMessage":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.feature.moderation_spam.action.moderate_entity.allowed.accessDenied","key":"error.lithium.policies.feature.moderation_spam.action.moderate_entity.allowed.accessDenied","args":[]}},"canReply":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action.message.reply_to_entity.allow.accessDenied","key":"error.lithium.policies.forums.action.message.reply_to_entity.allow.accessDenied","args":[]}},"canAcceptSolution":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.accepted_solutions.action_allow.message.mark_as_accepted_solution.accessDenied","key":"error.lithium.policies.accepted_solutions.action_allow.message.mark_as_accepted_solution.accessDenied","args":[]}},"canRejectSolution":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.accepted_solutions.action_allow.message.unmark_as_accepted_solution.accessDenied","key":"error.lithium.policies.accepted_solutions.action_allow.message.unmark_as_accepted_solution.accessDenied","args":[]}},"canTag":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.labels.action.labelableentity.set_labels.allow.accessDenied","key":"error.lithium.policies.labels.action.labelableentity.set_labels.allow.accessDenied","args":[]}},"canEdit":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action_allow.edit_message.accessDenied","key":"error.lithium.policies.forums.action_allow.edit_message.accessDenied","args":[]}},"canKudo":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.kudos.action.entity.give_kudos.allow.accessDenied","key":"error.lithium.policies.kudos.action.entity.give_kudos.allow.accessDenied","args":[]}},"canModerateEntity":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.moderation.action.moderatableentity.moderate_entity.allow.accessDenied","key":"error.lithium.policies.moderation.action.moderatableentity.moderate_entity.allow.accessDenied","args":[]}},"canDelete":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action.delete_message_view.delete_message.allow.accessDenied","key":"error.lithium.policies.forums.action.delete_message_view.delete_message.allow.accessDenied","args":[]}},"canMoveMessage":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.forums.action.message.move_message.allow.accessDenied","key":"error.lithium.policies.forums.action.message.move_message.allow.accessDenied","args":[]}},"canMarkMessageReadOnly":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.feature.forums.action.mark_message_readonly.allowed.accessDenied","key":"error.lithium.policies.feature.forums.action.mark_message_readonly.allowed.accessDenied","args":[]}},"canFreezeTkbArticle":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.tkb.action_can_freeze_article.accessDenied","key":"error.lithium.policies.tkb.action_can_freeze_article.accessDenied","args":[]}},"canReportAbuse":{"__typename":"PolicyResult","failureReason":null},"canDeleteDraft":{"__typename":"PolicyResult","failureReason":{"__typename":"FailureReason","message":"error.lithium.policies.delete_drafts.accessDenied","key":"error.lithium.policies.delete_drafts.accessDenied","args":[]}}},"contentWorkflow":{"__typename":"ContentWorkflow","state":"PUBLISH","scheduledPublishTime":null,"scheduledTimezone":null,"userContext":{"__typename":"MessageWorkflowContext","canSubmitForReview":null,"canEdit":false,"canRecall":null,"canSubmitForPublication":null,"canReturnToAuthor":null,"canPublish":null,"canReturnToReview":null,"canSchedule":false},"shortScheduledTimezone":null},"readOnly":false,"editFrozen":false,"showMoveIndicator":false,"moderationData":{"__ref":"ModerationData:moderation_data:4562742"},"teaser":"","body":"\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003eNot every step in an AI application needs a large language model to generate a response. Many high-volume application steps are decisions: classify an input, select an option, assign a score, verify a condition, prioritize an item, or control a workflow. To suit these tasks, a new class of models have been developed to address these fast, structured, requests.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003eWe are excited to be adding \u003cSTRONG\u003eMicrosoft-Decision-1 \u003c/STRONG\u003eto the Foundry Models Catalog. Our newest, decision model for applications that need to choose among predefined options rather than generate open-ended text.\u003c/P\u003e\n\u003cH1 id=\"community-4562742-toc-hId--1131847113\"\u003eWhat are decision models?\u003c/H1\u003e\n\u003cP\u003eAs AI applications mature, the industry is moving beyond the idea that every model interaction needs to result in generated content. Developers are increasingly building systems composed of different models, tools, and application logic, each suited to a different part of the workload. Within those systems, many of the most frequent operations are not generation problems at all. They are decisions about what should happen next.\u003c/P\u003e\n\u003cP\u003eDecision models were designed for this emerging layer of the AI stack. Rather than producing an open-ended response, they evaluate a defined set of possibilities and return structured signals that an application can use to take action. That makes them particularly relevant as developers move toward more dynamic AI applications, where models need to work together and applications must continuously determine where requests should go, which actions should be taken, and when additional processing is needed.\u003c/P\u003e\n\u003cP\u003eFor developers, this creates an opportunity to be more intentional about where and how different models are used. Instead of relying on a general-purpose generative model for every step, developers can match the model to the task, using generative and reasoning models where their capabilities are needed and decision models for focused, repeatable choices. \u003cSTRONG\u003eThe result is a more modular approach to AI application design, where generation, reasoning, and decision-making become complementary building blocks for creating intelligent systems.\u003c/STRONG\u003e\u003c/P\u003e\n\u003cDIV class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\n\u003cH1 id=\"community-4562742-toc-hId-1355665720\"\u003eWhat is Microsoft-Decision-1?\u003c/H1\u003e\n\u003c/DIV\u003e\n\u003cP\u003eNow available in public preview, \u003cA class=\"lia-external-url\" href=\"https://ai.azure.com/catalog/models/Microsoft-Decision-1\" target=\"_blank\" rel=\"noopener nofollow noreferrer\"\u003eMicrosoft-Decision-1\u003c/A\u003e is a decision model built on Qwen3.5-9B and designed for applications that need to make fast, structured choices among predefined options. It brings a purpose-built decision capability to the Foundry Models catalog, giving developers another building block for designing AI applications where different steps may benefit from different types of models.\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003e\u003cSTRONG\u003eBuilt for predefined decisions.\u003c/STRONG\u003e Microsoft-Decision-1 supports use cases such as agent controls, model routing, intent analysis, data labeling, AI judging, incident response routing, data validation, and content classification.\u003c/LI\u003e\n\u003cLI\u003e\u003cSTRONG\u003eStructured for application logic.\u003c/STRONG\u003e The model produces predefined answers and confidence signals that applications can use to select the next action or route uncertain results for further review.\u003c/LI\u003e\n\u003cLI\u003e\u003cSTRONG\u003eDesigned for lower-latency, lower-cost workflows.\u003c/STRONG\u003e Microsoft-Decision-1 is intended for simple, repeatable, and time-sensitive decisions that do not require the generative capabilities or extended reasoning of a larger language model.\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eYou can explore these capabilities in the Foundry Playground. This example below shows Microsoft-Decision-1 checking urgency, selecting a support team, and scoring priority for a customer request.\u0026nbsp;\u003c/P\u003e\n\u003cspan class=\"lia-media-object lia-media-is-center lia-media-size-default\" data-image-alt=\"\"\u003e\u003cbutton aria-labelledby=\"D5vg9G_caption\" class=\"lia-media-unstyled-btn\" type=\"button\" aria-haspopup=\"true\" aria-label=\"Enlarge Image \u0026lt;span data-teams=\u0026quot;true\u0026quot;\u0026gt;\u0026lt;em\u0026gt;Microsoft-Decision-1 in the Microsoft Foundry playground.\u0026lt;/em\u0026gt;\u0026lt;/span\u0026gt;\"\u003e\u003cimg src=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTYyNzQyLUQ1dmc5Rw?image-dimensions=999x485\u0026amp;revision=22\" width=\"999\" height=\"485\" alt=\"\" /\u003e\u003c/button\u003e\u003cspan class=\"lia-media-caption-text\" id=\"D5vg9G_caption\"\u003e\u003cSPAN data-teams=\"true\"\u003e\u003cEM\u003eMicrosoft-Decision-1 in the Microsoft Foundry playground.\u003c/EM\u003e\u003c/SPAN\u003e\u003c/span\u003e\u003c/span\u003e\n\u003cP\u003eMicrosoft-Decision-1 represents an area of continued model innovation at Microsoft. The team will rebase future iterations of the model on OpenAI models and Microsoft’s MAI models, bringing together advances from Microsoft’s own model portfolio with a model architecture purpose-built for decision-making. Over time, this work could create opportunities to further explore how Microsoft models can be specialized for the high-volume decisions that sit inside applications and agentic systems.\u003c/P\u003e\n\u003cP\u003eFor developers, Microsoft-Decision-1 expands the choices available when building applications and agents with Foundry. Rather than using the same model for every step, developers can combine generative and reasoning models with a decision model and choose the capability that best fits each part of the workflow.\u003cSTRONG\u003e \u003c/STRONG\u003eThat model diversity is increasingly important as AI applications evolve from single-model experiences into systems that coordinate specialized models, tools, and actions.\u003c/P\u003e\n\u003cDIV class=\"lia-align-left\" style=\"text-align : left;\"\u003e\n\u003cH2 id=\"community-4562742-toc-hId-2046227194\"\u003eHow developers are building with Microsoft-Decision-1\u003c/H2\u003e\n\u003c/DIV\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003eEnterprise applications make decisions throughout a workflow: identifying a customer’s intent, selecting a tool, routing an incident or checking whether a response meets specified criteria. For example, a support application could classify a request as a billing question, a technical issue or an account-access problem. An agent could evaluate a proposed response against a quality rubric and determine whether to accept it, revise it or request review.\u003c/P\u003e\n\u003cFIGURE style=\"margin: 0; padding: 0;\"\u003e\n\u003cDIV style=\"position: relative; width: 100%; height: 0; padding-bottom: 56.25%; overflow: hidden; border: 0;\"\u003e\u003cIFRAME src=\"https://aka.ms/mtc/media/MSF-26100801\" title=\"Microsoft Decision 1 demo\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen; picture-in-picture\" style=\"position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;\" sandbox=\"allow-scripts allow-same-origin allow-forms\"\u003e\n    \u003c/IFRAME\u003e\u003c/DIV\u003e\n\u003cFIGCAPTION id=\"video-caption\" style=\"font-size: 14px; line-height: 1.5; color: #1f1f1f; text-align: left; margin-top: 8px;\"\u003eIf the player doesn’t load, open the video in a new window: \u003cA style=\"color: #0a5bd9; text-decoration: underline;\" title=\"Open the video in a new window\" href=\"https://aka.ms/mtc/media/MSF-26100801\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e Open video \u003c/A\u003e\u003c/FIGCAPTION\u003e\n\u003c/FIGURE\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\u0026nbsp;\u003c/P\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003eThese decisions can sit alongside generative and reasoning steps in the same application. A language model might draft a response, while Microsoft-Decision-1 evaluates it against defined criteria. With Microsoft-Decision-1 in the Foundry catalog, developers can explore decision workloads through the platform they use to discover and deploy models across various scenarios:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003e\n\u003cDIV class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\u003cSTRONG\u003eClassification:\u003c/STRONG\u003e Assign inputs to defined categories, such as customer intents or feedback themes.\u003c/DIV\u003e\n\u003c/LI\u003e\n\u003cLI\u003e\n\u003cDIV class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\u003cSTRONG\u003eRouting:\u003c/STRONG\u003e Select a model, tool, destination or workflow from a set of options.\u003c/DIV\u003e\n\u003c/LI\u003e\n\u003cLI\u003e\n\u003cDIV class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\u003cSTRONG\u003eEvaluation and verification:\u003c/STRONG\u003e Assess responses or inputs against specified criteria.\u003c/DIV\u003e\n\u003c/LI\u003e\n\u003cLI\u003e\n\u003cDIV class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\u003cSTRONG\u003eWorkflow control:\u003c/STRONG\u003e Decide whether to continue, retry, stop or send a case for review.\u003c/DIV\u003e\n\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cH1 id=\"community-4562742-toc-hId-2035724090\"\u003eA different model for a different kind of workload\u003c/H1\u003e\n\u003cP\u003eFor developers, decision models introduce a different way to think about optimization. An AI application may make thousands of small choices around a comparatively small number of complex generative or reasoning tasks. Running every one of those steps through the same general-purpose model can overlook an opportunity to optimize the system around the work each step actually needs to perform.\u003c/P\u003e\n\u003cP\u003eThat pattern is showing up across Microsoft.\u003cSTRONG\u003e \u003c/STRONG\u003eXbox Research used Microsoft-Decision-1 to categorize more than 10,000 pieces of open-ended feedback into researcher-defined themes, reporting quality competitive with GPT-5 while running 80–100 times faster. Other Microsoft teams have also evaluated the model for assessing Copilot response quality and supporting adaptive replanning in Microsoft Discovery.\u003c/P\u003e\n\u003cP\u003eThese scenarios matter because they are not simply classification benchmarks. They are examples of decisions embedded inside larger applications. As AI architectures become more modular, developers can consider generation, reasoning, and decision-making as distinct workloads, then select models based on what each step actually requires.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003eFor benchmark methodology, measured results and additional examples, read the \u003cA href=\"https://commandline.microsoft.com/microsoft-decision-1-model-foundry/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cEM\u003eCommand Line blog here.\u003c/EM\u003e\u003c/A\u003e\u003c/P\u003e\n\u003cDIV class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\n\u003cH3 id=\"community-4562742-toc-hId-929334205\"\u003ePutting Microsoft-Decision-1 to work\u003c/H3\u003e\n\u003c/DIV\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003eFor tasks with predefined outcomes, evaluate Microsoft-Decision-1 using representative inputs and the quality, latency and cost requirements of your application. Compare decision accuracy, including ambiguous cases, latency under expected traffic and cost per completed decision. Where confidence estimates inform automation or review thresholds, validate their calibration on your own data.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\u003cSTRONG\u003eStart with a decision in your application: \u003c/STRONG\u003eThe following Python example shows how to compare support-routing decisions with expected labels and measure request latency. Replace the illustrative messages and category definitions with examples from your own workload.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\u003cSTRONG\u003eBefore running:\u003c/STRONG\u003e Deploy Microsoft-Decision-1 in your Microsoft Foundry subscription and configure FOUNDRY_BASE_URL and FOUNDRY_API_KEY. Set FOUNDRY_MODEL to the model or deployment identifier specified in the quickstart. Keep credentials outside the source code. Model requests incur applicable usage charges.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\" style=\"text-align : justify;\"\u003e\u003cSTRONG\u003eIntegration note:\u003c/STRONG\u003e Confirm the route and authentication header before running it against your deployment.\u003c/P\u003e\n\u003cpre class=\"lia-code-sample language-python\"\u003e\u003ccode\u003e#!/usr/bin/env python3\n\"\"\"Classify support requests with Microsoft-Decision-1.\"\"\"\n \nimport json\nimport os\nimport urllib.error\nimport urllib.request\nfrom collections.abc import Mapping\nfrom statistics import median\nfrom time import perf_counter\nfrom typing import Any\n \nfrom azure.identity import DefaultAzureCredential\n \n \nOPTIONS = {\n    \"billing\": \"Charges, invoices, refunds, or subscription payments\",\n    \"technical\": \"Software errors, bugs, or integration failures\",\n    \"account\": \"Sign-in, password, or account-access problems\",\n}\n \nEXAMPLES = [\n    (\"I was charged twice.\", \"billing\"),\n    (\"The integration crashes during checkout.\", \"technical\"),\n    (\"I cannot sign in after resetting my password.\", \"account\"),\n]\n \nAZURE_ENDPOINT = os.environ[\"AZURE_ENDPOINT\"].rstrip(\"/\")\nDEPLOYMENT_NAME = os.environ[\"DEPLOYMENT_NAME\"]\nTIMEOUT_SECONDS = 60\nTOKEN_SCOPE = \"https://cognitiveservices.azure.com/.default\"\nCREDENTIAL = DefaultAzureCredential()\n \n \nclass DecisionAPIError(RuntimeError):\n    \"\"\"Raised when the API can't return a valid classification.\"\"\"\n \n \ndef read_choice(\n    payload: Any,\n    options: Mapping[str, str],\n) -\u0026gt; str:\n    if not isinstance(payload, dict):\n        raise DecisionAPIError(\"The API returned an invalid response.\")\n \n    answers = payload.get(\"answers\")\n    if not isinstance(answers, dict):\n        raise DecisionAPIError(\"The API returned no answers object.\")\n \n    answer = answers.get(\"team\")\n    if not isinstance(answer, dict) or answer.get(\"type\") != \"choice\":\n        raise DecisionAPIError(\"The API returned an invalid answer.\")\n \n    choice = answer.get(\"choice\")\n    if not isinstance(choice, str) or choice not in options:\n        raise DecisionAPIError(\n            f\"The API selected an unsupported team: {choice!r}.\"\n        )\n    return choice\n \n \ndef predict(\n    text: str,\n    options: Mapping[str, str],\n) -\u0026gt; str:\n    if not text.strip():\n        raise ValueError(\"text must not be empty.\")\n    if len(options) \u0026lt; 2:\n        raise ValueError(\"options must contain at least two choices.\")\n \n    body = json.dumps(\n        {\n            \"model\": DEPLOYMENT_NAME,\n            \"state\": text,\n            \"questions\": {\n                \"team\": {\n                    \"type\": \"choice\",\n                    \"instructions\": (\n                        \"Which team should handle this customer support \"\n                        \"request? Select exactly one team based on the \"\n                        \"primary problem.\"\n                    ),\n                    \"criteria\": dict(options),\n                }\n            },\n        }\n    ).encode(\"utf-8\")\n    access_token = CREDENTIAL.get_token(TOKEN_SCOPE).token\n \n    request = urllib.request.Request(\n        f\"{AZURE_ENDPOINT}/providers/microsoft/v1/systemone\",\n        data=body,\n        headers={\n            \"Authorization\": f\"Bearer {access_token}\",\n            \"Content-Type\": \"application/json\",\n            \"Accept\": \"application/json\",\n        },\n        method=\"POST\",\n    )\n \n    try:\n        with urllib.request.urlopen(\n            request,\n            timeout=TIMEOUT_SECONDS,\n        ) as response:\n            response_body = response.read()\n    except urllib.error.HTTPError as exc:\n        raise DecisionAPIError(\n            f\"The API returned HTTP {exc.code}.\"\n        ) from exc\n    except urllib.error.URLError as exc:\n        raise DecisionAPIError(\n            f\"Couldn't reach the API: {exc.reason}.\"\n        ) from exc\n \n    try:\n        payload = json.loads(response_body)\n    except (json.JSONDecodeError, UnicodeDecodeError) as exc:\n        raise DecisionAPIError(\n            \"The API returned invalid JSON.\"\n        ) from exc\n    return read_choice(payload, options)\n \n \ndef main() -\u0026gt; None:\n    correct = 0\n    latencies_ms = []\n \n    for text, expected in EXAMPLES:\n        start = perf_counter()\n        predicted = predict(text, OPTIONS)\n        elapsed_ms = (perf_counter() - start) * 1000\n \n        correct += int(predicted == expected)\n        latencies_ms.append(elapsed_ms)\n        print(\n            f\"Expected={expected}, predicted={predicted}, \"\n            f\"latency={elapsed_ms:.1f} ms\"\n        )\n \n    accuracy = correct / len(EXAMPLES)\n    print(f\"Accuracy: {accuracy:.1%}\")\n    print(\n        \"Median request latency: \"\n        f\"{median(latencies_ms):.1f} ms\"\n    )\n \n \nif __name__ == \"__main__\":\n    main()\u003c/code\u003e\u003c/pre\u003e\n\u003cP\u003eThis small dataset illustrates the evaluation process. For meaningful results, use a larger, representative labeled dataset and inspect errors by category. The measured latency includes the client call and network time; sequential requests do not measure latency under production load. Assess cost and confidence calibration separately.\u003c/P\u003e\n\u003cP\u003eYour application defines the available options and resulting actions. Use evaluation results to determine where automation is appropriate and where additional validation or human review is needed.\u003c/P\u003e\n\u003cP\u003e\u003cSTRONG\u003ePricing\u003c/STRONG\u003e\u003c/P\u003e\n\u003cDIV class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"\u003e\u003ctable class=\"lia-border-color-21 lia-border-style-solid\" border=\"1\" style=\"width: 100.556%; height: 155.312px; border-width: 1px;\"\u003e\u003ctbody\u003e\u003ctr style=\"height: 38.8281px;\"\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003e\u003cSTRONG\u003eModel\u003c/STRONG\u003e\u003c/P\u003e\n\u003c/td\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003e\u003cSTRONG\u003eDeployment Type\u003c/STRONG\u003e\u003c/P\u003e\n\u003c/td\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003e\u003cSTRONG\u003eInput Tokens (#/1M)\u003c/STRONG\u003e\u003c/P\u003e\n\u003c/td\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003e\u003cSTRONG\u003eOutput tokens (#/1M)\u003c/STRONG\u003e\u003c/P\u003e\n\u003c/td\u003e\u003c/tr\u003e\u003ctr style=\"height: 38.8281px;\"\u003e\u003ctd class=\"lia-border-color-21\" rowspan=\"2\" style=\"height: 116.484px;\"\u003e\n\u003cP\u003eMicrosoft-Decision-1\u003c/P\u003e\n\u003c/td\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003eUS Datazone\u003c/P\u003e\n\u003c/td\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003e$0.042\u003c/P\u003e\n\u003c/td\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003eN/A\u003c/P\u003e\n\u003c/td\u003e\u003c/tr\u003e\u003ctr style=\"height: 38.8281px;\"\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003eEU Datazone\u003c/P\u003e\n\u003c/td\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003e$0.042\u003c/P\u003e\n\u003c/td\u003e\u003ctd class=\"lia-border-color-21\" style=\"height: 38.8281px;\"\u003e\n\u003cP\u003eN/A\u003c/P\u003e\n\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003ccolgroup\u003e\u003ccol style=\"width: 25.00%\" /\u003e\u003ccol style=\"width: 25.00%\" /\u003e\u003ccol style=\"width: 25.00%\" /\u003e\u003ccol style=\"width: 25.00%\" /\u003e\u003c/colgroup\u003e\u003c/table\u003e\u003c/DIV\u003e\n\u003cH1 id=\"community-4562742-toc-hId--1579184836\"\u003eGet started\u003c/H1\u003e\n\u003cP\u003eExplore Microsoft-Decision-1 in the\u003cA class=\"lia-external-url\" href=\"https://ai.azure.com/catalog/models/Microsoft-Decision-1\" target=\"_blank\" rel=\"noopener nofollow noreferrer\"\u003e Foundry catalog\u003c/A\u003e to make your first request. We look forward to seeing how developers use Microsoft-Decision-1 to bring structured decisions into their applications and agents through Microsoft Foundry.\u003c/P\u003e","body@stringLength":"18553","rawBody":"\u003cP class=\"lia-align-justify\"\u003eNot every step in an AI application needs a large language model to generate a response. Many high-volume application steps are decisions: classify an input, select an option, assign a score, verify a condition, prioritize an item, or control a workflow. To suit these tasks, a new class of models have been developed to address these fast, structured, requests.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\"\u003eWe are excited to be adding \u003cSTRONG\u003eMicrosoft-Decision-1 \u003c/STRONG\u003eto the Foundry Models Catalog. Our newest, decision model for applications that need to choose among predefined options rather than generate open-ended text.\u003c/P\u003e\n\u003cH1\u003eWhat are decision models?\u003c/H1\u003e\n\u003cP\u003eAs AI applications mature, the industry is moving beyond the idea that every model interaction needs to result in generated content. Developers are increasingly building systems composed of different models, tools, and application logic, each suited to a different part of the workload. Within those systems, many of the most frequent operations are not generation problems at all. They are decisions about what should happen next.\u003c/P\u003e\n\u003cP\u003eDecision models were designed for this emerging layer of the AI stack. Rather than producing an open-ended response, they evaluate a defined set of possibilities and return structured signals that an application can use to take action. That makes them particularly relevant as developers move toward more dynamic AI applications, where models need to work together and applications must continuously determine where requests should go, which actions should be taken, and when additional processing is needed.\u003c/P\u003e\n\u003cP\u003eFor developers, this creates an opportunity to be more intentional about where and how different models are used. Instead of relying on a general-purpose generative model for every step, developers can match the model to the task, using generative and reasoning models where their capabilities are needed and decision models for focused, repeatable choices. \u003cSTRONG\u003eThe result is a more modular approach to AI application design, where generation, reasoning, and decision-making become complementary building blocks for creating intelligent systems.\u003c/STRONG\u003e\u003c/P\u003e\n\u003cDIV class=\"lia-align-justify\"\u003e\n\u003cH1\u003eWhat is Microsoft-Decision-1?\u003c/H1\u003e\n\u003c/DIV\u003e\n\u003cP\u003eNow available in public preview, \u003cA class=\"lia-external-url\" href=\"https://ai.azure.com/catalog/models/Microsoft-Decision-1\" target=\"_blank\" rel=\"noopener\"\u003eMicrosoft-Decision-1\u003c/A\u003e is a decision model built on Qwen3.5-9B and designed for applications that need to make fast, structured choices among predefined options. It brings a purpose-built decision capability to the Foundry Models catalog, giving developers another building block for designing AI applications where different steps may benefit from different types of models.\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003e\u003cSTRONG\u003eBuilt for predefined decisions.\u003c/STRONG\u003e Microsoft-Decision-1 supports use cases such as agent controls, model routing, intent analysis, data labeling, AI judging, incident response routing, data validation, and content classification.\u003c/LI\u003e\n\u003cLI\u003e\u003cSTRONG\u003eStructured for application logic.\u003c/STRONG\u003e The model produces predefined answers and confidence signals that applications can use to select the next action or route uncertain results for further review.\u003c/LI\u003e\n\u003cLI\u003e\u003cSTRONG\u003eDesigned for lower-latency, lower-cost workflows.\u003c/STRONG\u003e Microsoft-Decision-1 is intended for simple, repeatable, and time-sensitive decisions that do not require the generative capabilities or extended reasoning of a larger language model.\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cP\u003eYou can explore these capabilities in the Foundry Playground. This example below shows Microsoft-Decision-1 checking urgency, selecting a support team, and scoring priority for a customer request.\u0026nbsp;\u003c/P\u003e\n\u003cLI-IMAGE id=\"D5vg9G\" caption=\"true\" alt=\"\" align=\"center\" resized=\"false\" size=\"default\" layout=\"stretch\" name=\"\" src=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NTYyNzQyLUQ1dmc5Rw?image-dimensions=750x750\u0026amp;revision=22\"\u003e\u003cSPAN data-teams=\"true\"\u003e\u003cEM\u003eMicrosoft-Decision-1 in the Microsoft Foundry playground.\u003c/EM\u003e\u003c/SPAN\u003e\u003c/LI-IMAGE\u003e\n\u003cP\u003eMicrosoft-Decision-1 represents an area of continued model innovation at Microsoft. The team will rebase future iterations of the model on OpenAI models and Microsoft’s MAI models, bringing together advances from Microsoft’s own model portfolio with a model architecture purpose-built for decision-making. Over time, this work could create opportunities to further explore how Microsoft models can be specialized for the high-volume decisions that sit inside applications and agentic systems.\u003c/P\u003e\n\u003cP\u003eFor developers, Microsoft-Decision-1 expands the choices available when building applications and agents with Foundry. Rather than using the same model for every step, developers can combine generative and reasoning models with a decision model and choose the capability that best fits each part of the workflow.\u003cSTRONG\u003e \u003c/STRONG\u003eThat model diversity is increasingly important as AI applications evolve from single-model experiences into systems that coordinate specialized models, tools, and actions.\u003c/P\u003e\n\u003cDIV class=\"lia-align-left\"\u003e\n\u003cH2\u003eHow developers are building with Microsoft-Decision-1\u003c/H2\u003e\n\u003c/DIV\u003e\n\u003cP class=\"lia-align-justify\"\u003eEnterprise applications make decisions throughout a workflow: identifying a customer’s intent, selecting a tool, routing an incident or checking whether a response meets specified criteria. For example, a support application could classify a request as a billing question, a technical issue or an account-access problem. An agent could evaluate a proposed response against a quality rubric and determine whether to accept it, revise it or request review.\u003c/P\u003e\n\u003cFIGURE style=\"margin: 0; padding: 0;\"\u003e\n\u003cDIV style=\"position: relative; width: 100%; height: 0; padding-bottom: 56.25%; overflow: hidden; border: 0;\"\u003e\u003cIFRAME src=\"https://aka.ms/mtc/media/MSF-26100801\" title=\"Microsoft Decision 1 demo\" allowfullscreen=\"allowfullscreen\" allow=\"fullscreen; picture-in-picture\" style=\"position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;\" sandbox=\"allow-scripts allow-same-origin allow-forms\"\u003e\n    \u003c/IFRAME\u003e\u003c/DIV\u003e\n\u003cFIGCAPTION id=\"video-caption\" style=\"font-size: 14px; line-height: 1.5; color: #1f1f1f; text-align: left; margin-top: 8px;\"\u003eIf the player doesn’t load, open the video in a new window: \u003cA style=\"color: #0a5bd9; text-decoration: underline;\" title=\"Open the video in a new window\" href=\"https://aka.ms/mtc/media/MSF-26100801\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e Open video \u003c/A\u003e\u003c/FIGCAPTION\u003e\n\u003c/FIGURE\u003e\n\u003cP class=\"lia-align-justify\"\u003e\u0026nbsp;\u003c/P\u003e\n\u003cP class=\"lia-align-justify\"\u003eThese decisions can sit alongside generative and reasoning steps in the same application. A language model might draft a response, while Microsoft-Decision-1 evaluates it against defined criteria. With Microsoft-Decision-1 in the Foundry catalog, developers can explore decision workloads through the platform they use to discover and deploy models across various scenarios:\u003c/P\u003e\n\u003cUL\u003e\n\u003cLI\u003e\n\u003cDIV class=\"lia-align-justify\"\u003e\u003cSTRONG\u003eClassification:\u003c/STRONG\u003e Assign inputs to defined categories, such as customer intents or feedback themes.\u003c/DIV\u003e\n\u003c/LI\u003e\n\u003cLI\u003e\n\u003cDIV class=\"lia-align-justify\"\u003e\u003cSTRONG\u003eRouting:\u003c/STRONG\u003e Select a model, tool, destination or workflow from a set of options.\u003c/DIV\u003e\n\u003c/LI\u003e\n\u003cLI\u003e\n\u003cDIV class=\"lia-align-justify\"\u003e\u003cSTRONG\u003eEvaluation and verification:\u003c/STRONG\u003e Assess responses or inputs against specified criteria.\u003c/DIV\u003e\n\u003c/LI\u003e\n\u003cLI\u003e\n\u003cDIV class=\"lia-align-justify\"\u003e\u003cSTRONG\u003eWorkflow control:\u003c/STRONG\u003e Decide whether to continue, retry, stop or send a case for review.\u003c/DIV\u003e\n\u003c/LI\u003e\n\u003c/UL\u003e\n\u003cH1\u003eA different model for a different kind of workload\u003c/H1\u003e\n\u003cP\u003eFor developers, decision models introduce a different way to think about optimization. An AI application may make thousands of small choices around a comparatively small number of complex generative or reasoning tasks. Running every one of those steps through the same general-purpose model can overlook an opportunity to optimize the system around the work each step actually needs to perform.\u003c/P\u003e\n\u003cP\u003eThat pattern is showing up across Microsoft.\u003cSTRONG\u003e \u003c/STRONG\u003eXbox Research used Microsoft-Decision-1 to categorize more than 10,000 pieces of open-ended feedback into researcher-defined themes, reporting quality competitive with GPT-5 while running 80–100 times faster. Other Microsoft teams have also evaluated the model for assessing Copilot response quality and supporting adaptive replanning in Microsoft Discovery.\u003c/P\u003e\n\u003cP\u003eThese scenarios matter because they are not simply classification benchmarks. They are examples of decisions embedded inside larger applications. As AI architectures become more modular, developers can consider generation, reasoning, and decision-making as distinct workloads, then select models based on what each step actually requires.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\"\u003eFor benchmark methodology, measured results and additional examples, read the \u003cA href=\"https://commandline.microsoft.com/microsoft-decision-1-model-foundry/\" target=\"_blank\" rel=\"noopener\"\u003e\u003cEM\u003eCommand Line blog here.\u003c/EM\u003e\u003c/A\u003e\u003c/P\u003e\n\u003cDIV class=\"lia-align-justify\"\u003e\n\u003cH3\u003ePutting Microsoft-Decision-1 to work\u003c/H3\u003e\n\u003c/DIV\u003e\n\u003cP class=\"lia-align-justify\"\u003eFor tasks with predefined outcomes, evaluate Microsoft-Decision-1 using representative inputs and the quality, latency and cost requirements of your application. Compare decision accuracy, including ambiguous cases, latency under expected traffic and cost per completed decision. Where confidence estimates inform automation or review thresholds, validate their calibration on your own data.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\"\u003e\u003cSTRONG\u003eStart with a decision in your application: \u003c/STRONG\u003eThe following Python example shows how to compare support-routing decisions with expected labels and measure request latency. Replace the illustrative messages and category definitions with examples from your own workload.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\"\u003e\u003cSTRONG\u003eBefore running:\u003c/STRONG\u003e Deploy Microsoft-Decision-1 in your Microsoft Foundry subscription and configure FOUNDRY_BASE_URL and FOUNDRY_API_KEY. Set FOUNDRY_MODEL to the model or deployment identifier specified in the quickstart. Keep credentials outside the source code. Model requests incur applicable usage charges.\u003c/P\u003e\n\u003cP class=\"lia-align-justify\"\u003e\u003cSTRONG\u003eIntegration note:\u003c/STRONG\u003e Confirm the route and authentication header before running it against your deployment.\u003c/P\u003e\n\u003cLI-CODE lang=\"python\"\u003e#!/usr/bin/env python3\n\"\"\"Classify support requests with Microsoft-Decision-1.\"\"\"\n \nimport json\nimport os\nimport urllib.error\nimport urllib.request\nfrom collections.abc import Mapping\nfrom statistics import median\nfrom time import perf_counter\nfrom typing import Any\n \nfrom azure.identity import DefaultAzureCredential\n \n \nOPTIONS = {\n    \"billing\": \"Charges, invoices, refunds, or subscription payments\",\n    \"technical\": \"Software errors, bugs, or integration failures\",\n    \"account\": \"Sign-in, password, or account-access problems\",\n}\n \nEXAMPLES = [\n    (\"I was charged twice.\", \"billing\"),\n    (\"The integration crashes during checkout.\", \"technical\"),\n    (\"I cannot sign in after resetting my password.\", \"account\"),\n]\n \nAZURE_ENDPOINT = os.environ[\"AZURE_ENDPOINT\"].rstrip(\"/\")\nDEPLOYMENT_NAME = os.environ[\"DEPLOYMENT_NAME\"]\nTIMEOUT_SECONDS = 60\nTOKEN_SCOPE = \"https://cognitiveservices.azure.com/.default\"\nCREDENTIAL = DefaultAzureCredential()\n \n \nclass DecisionAPIError(RuntimeError):\n    \"\"\"Raised when the API can't return a valid classification.\"\"\"\n \n \ndef read_choice(\n    payload: Any,\n    options: Mapping[str, str],\n) -\u0026gt; str:\n    if not isinstance(payload, dict):\n        raise DecisionAPIError(\"The API returned an invalid response.\")\n \n    answers = payload.get(\"answers\")\n    if not isinstance(answers, dict):\n        raise DecisionAPIError(\"The API returned no answers object.\")\n \n    answer = answers.get(\"team\")\n    if not isinstance(answer, dict) or answer.get(\"type\") != \"choice\":\n        raise DecisionAPIError(\"The API returned an invalid answer.\")\n \n    choice = answer.get(\"choice\")\n    if not isinstance(choice, str) or choice not in options:\n        raise DecisionAPIError(\n            f\"The API selected an unsupported team: {choice!r}.\"\n        )\n    return choice\n \n \ndef predict(\n    text: str,\n    options: Mapping[str, str],\n) -\u0026gt; str:\n    if not text.strip():\n        raise ValueError(\"text must not be empty.\")\n    if len(options) \u0026lt; 2:\n        raise ValueError(\"options must contain at least two choices.\")\n \n    body = json.dumps(\n        {\n            \"model\": DEPLOYMENT_NAME,\n            \"state\": text,\n            \"questions\": {\n                \"team\": {\n                    \"type\": \"choice\",\n                    \"instructions\": (\n                        \"Which team should handle this customer support \"\n                        \"request? Select exactly one team based on the \"\n                        \"primary problem.\"\n                    ),\n                    \"criteria\": dict(options),\n                }\n            },\n        }\n    ).encode(\"utf-8\")\n    access_token = CREDENTIAL.get_token(TOKEN_SCOPE).token\n \n    request = urllib.request.Request(\n        f\"{AZURE_ENDPOINT}/providers/microsoft/v1/systemone\",\n        data=body,\n        headers={\n            \"Authorization\": f\"Bearer {access_token}\",\n            \"Content-Type\": \"application/json\",\n            \"Accept\": \"application/json\",\n        },\n        method=\"POST\",\n    )\n \n    try:\n        with urllib.request.urlopen(\n            request,\n            timeout=TIMEOUT_SECONDS,\n        ) as response:\n            response_body = response.read()\n    except urllib.error.HTTPError as exc:\n        raise DecisionAPIError(\n            f\"The API returned HTTP {exc.code}.\"\n        ) from exc\n    except urllib.error.URLError as exc:\n        raise DecisionAPIError(\n            f\"Couldn't reach the API: {exc.reason}.\"\n        ) from exc\n \n    try:\n        payload = json.loads(response_body)\n    except (json.JSONDecodeError, UnicodeDecodeError) as exc:\n        raise DecisionAPIError(\n            \"The API returned invalid JSON.\"\n        ) from exc\n    return read_choice(payload, options)\n \n \ndef main() -\u0026gt; None:\n    correct = 0\n    latencies_ms = []\n \n    for text, expected in EXAMPLES:\n        start = perf_counter()\n        predicted = predict(text, OPTIONS)\n        elapsed_ms = (perf_counter() - start) * 1000\n \n        correct += int(predicted == expected)\n        latencies_ms.append(elapsed_ms)\n        print(\n            f\"Expected={expected}, predicted={predicted}, \"\n            f\"latency={elapsed_ms:.1f} ms\"\n        )\n \n    accuracy = correct / len(EXAMPLES)\n    print(f\"Accuracy: {accuracy:.1%}\")\n    print(\n        \"Median request latency: \"\n        f\"{median(latencies_ms):.1f} ms\"\n    )\n \n \nif __name__ == \"__main__\":\n    main()\u003c/LI-CODE\u003e\n\u003cP\u003eThis small dataset illustrates the evaluation process. For meaningful results, use a larger, representative labeled dataset and inspect errors by category. The measured latency includes the client call and network time; sequential requests do not measure latency under production load. Assess cost and confidence calibration separately.\u003c/P\u003e\n\u003cP\u003eYour application defines the available options and resulting actions. Use evaluation results to determine where automation is appropriate and where additional validation or human review is needed.\u003c/P\u003e\n\u003cP\u003e\u003cSTRONG\u003ePricing\u003c/STRONG\u003e\u003c/P\u003e\n\u003cDIV class=\"styles_lia-table-wrapper__h6Xo9 styles_table-responsive__MW0lN\"\u003e\u003cLI-TABLE class=\"lia-border-color-21 lia-border-style-solid\" width=\"100.556%\" height=\"155.312px\" border=\"1\"\u003e\u003cLI-TSECTION name=\"tbody\"\u003e\u003cLI-TR height=\"38.8281px\"\u003e\u003cLI-TD name=\"td\" class=\"lia-border-color-21\" height=\"38.8281px\"\u003e\n\u003cP\u003e\u003cSTRONG\u003eModel\u003c/STRONG\u003e\u003c/P\u003e\n\u003c/LI-TD\u003e\u003cLI-TD name=\"td\" class=\"lia-border-color-21\" height=\"38.8281px\"\u003e\n\u003cP\u003e\u003cSTRONG\u003eDeployment Type\u003c/STRONG\u003e\u003c/P\u003e\n\u003c/LI-TD\u003e\u003cLI-TD
