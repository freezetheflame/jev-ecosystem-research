<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Methodology · Decision Index 0.3.2</title>
<meta name="description" content="How the Decision Index is built: the frozen suite, every benchmark's subset rule and random baseline, the index formula, the rules every entrant plays by, how entrants are classified, and how latency is measured.">
<link rel="icon" href="huggies/decision-favicon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Methodology · Decision Index 0.3.2">
<meta property="og:description" content="Everything needed to audit the Decision Index: suite, benchmarks, formula, rules, classification, latency.">
<meta property="og:url" content="https://huggingface.co/spaces/multimodalart/jev-decision-index/methodology.html">
<meta property="og:image" content="https://huggingface.co/spaces/multimodalart/jev-decision-index/resolve/main/og.png?v=0.3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Chewy&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9E6DD;--surface:#FBF8F1;--ink:#232323;--soft:#55524B;--muted:#8C8C8C;--line:#D8D3C8;--paper:#FFF1C6;
 --yellow:#FFD21E;--orange:#FF9D00;--blue:#3B7CF6;--red:#EF3E36;--purple:#A855F7;--green:#3E8E5E;
 --display:'Chewy','Source Sans 3',cursive;--body:'Source Sans 3',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
 --ar:#3B7CF6;--diff:#A855F7;--enc:#3E8E5E;--gli:#FF9D00;--jev:#232323}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body)}
a{color:var(--ink)}
button{font:inherit;color:inherit}
main{max-width:1180px;margin:auto;padding:0 28px 80px}
.switch-bar{display:flex;justify-content:center;padding:18px 20px 0}
.switch{display:inline-flex;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:4px;box-shadow:3px 3px 0 var(--ink);font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.switch a{text-decoration:none;padding:6px 18px;border-radius:999px;color:var(--soft)}
.switch a.on{background:var(--yellow);color:var(--ink);font-weight:500}
.switch a:not(.on):hover{color:var(--ink)}
.hero{text-align:center;margin:34px 0 22px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,6.5vw,72px);line-height:1;margin:0}
.hero h1 mark{background:var(--yellow);color:var(--ink);padding:0 .1em;border-radius:4px}
.hero p{max-width:720px;margin:18px auto 0;font-size:19px}
.hero .meta{font-family:var(--mono);font-size:12px;color:var(--soft);margin-top:14px;letter-spacing:.03em}
.toc{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px auto 0}
.toc a{font-family:var(--mono);font-size:12px;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:5px 13px;background:var(--surface);color:var(--soft);box-shadow:2px 2px 0 var(--ink);transition:transform .08s}
.toc a:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:0 0 22px}
.tile{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:16px 18px;box-shadow:4px 4px 0 var(--ink);text-align:left;min-width:0}
.tile.key{background:var(--yellow)}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.04em;display:block;margin-top:3px}
.tile.key span{color:#6b5a09}
h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
h3{font-size:17px;margin:0 0 6px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:46px 0 16px;flex-wrap:wrap;scroll-margin-top:16px}
.head p{margin:0;font-size:15px;color:var(--soft);max-width:620px}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.panel.pad{padding:18px 22px 16px}
.panel.pad p{margin:0 0 12px;font-size:15.5px}
.panel.pad p:last-child{margin-bottom:0}
.prose{max-width:820px}
.vsgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:start}.vsfig{margin:0;min-width:0;background:#F3F0E8;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px 6px}.vsfig figcaption{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin-bottom:6px}.vsfig svg{width:100%;height:auto;display:block}.vsnote{font-family:var(--mono);font-size:10.5px;color:var(--soft);margin:4px 0 0}.mvax{font-family:var(--mono);font-size:11px;fill:var(--soft)}.mvlab{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:#F3F0E8;stroke-width:3.5px}
@media (max-width:900px){.vsgrid{grid-template-columns:1fr}}
.prose ul,.prose ol{margin:6px 0 12px;padding-left:22px;font-size:15px}
.prose li{margin:4px 0}
.note{font-size:14px;color:var(--soft);line-height:1.6;margin:10px 0}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:left;background:var(--yellow);color:var(--ink);padding:12px 14px;border-bottom:2px solid var(--ink);white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th[data-dir]::after{content:"\2191";margin-left:5px}th[data-dir=desc]::after{content:"\2193"}
th.r,td.r{text-align:right}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FFFCEF}
.table-scroll{overflow-x:auto}
.bm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}
.bm small{font-family:var(--mono);font-size:11px;color:var(--soft);font-weight:400}
.swatch{width:11px;height:11px;border:2px solid var(--ink);border-radius:3px;flex:none;display:inline-block}
.bm-sub{color:var(--soft);font-size:12.5px;margin-top:4px;max-width:340px;line-height:1.45}
.pill{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;background:#fff;white-space:nowrap;display:inline-block}
.pill.yes{background:var(--yellow)}.pill.no{background:#ECEAE2;color:var(--soft)}
.pill.k-tech{background:#DCE7FB}.pill.k-full{background:#F1DDF8}.pill.k-lora{background:#DDEFE3}.pill.k-head{background:#FFE7BF}.pill.k-jev{background:var(--ink);color:#fff}
.mono{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.mono small{display:block;color:var(--soft);font-size:11px}
.muted{color:var(--muted)}
.rule{font-size:13.5px;max-width:330px;line-height:1.45}
td.subset{min-width:230px;max-width:330px;font-size:13.5px;line-height:1.45}
td.reasons{min-width:280px}
tr.bench{cursor:pointer}
tr.detail td{background:#F7F3E8;font-size:14px;padding:14px 18px 16px}
tr.detail dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;margin:0}
tr.detail dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);padding-top:2px}
tr.detail dd{margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:16px 18px;box-shadow:4px 4px 0 var(--ink);min-width:0}
.card h3{margin:0 0 4px;font-size:16px}
.card .f{font-family:var(--mono);font-size:12px;color:var(--soft);display:block;margin:6px 0 8px;word-break:break-word}
.card p{margin:0;font-size:14px;color:var(--soft);line-height:1.55}
.math{background:var(--surface);border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:20px 24px;font-family:var(--mono);font-size:15px;line-height:1.9;overflow-x:auto}
.math .l{display:block;white-space:normal;padding-left:150px;text-indent:-150px;margin:2px 0}
.math .l b{font-weight:500;color:var(--ink)}
.math .l i{font-style:normal;color:var(--soft)}
.math .l sub{font-size:11px}
.math .l sup{font-size:11px}
.math .lab{display:inline-block;width:150px;text-indent:0;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em;vertical-align:top}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:16px}
.area{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);border-top:8px solid var(--c);min-width:0}
.area h3{display:flex;align-items:center;gap:8px;margin:0}
.area .n{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:2px}
.area ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.area li{display:flex;gap:10px;font-size:14px;align-items:baseline}
.area li .id{font-family:var(--mono);font-size:11px;color:var(--soft);min-width:26px;text-align:right}
.area li.dim{color:var(--soft)}
.area p{font-size:13px;color:var(--soft);margin:6px 0 0;line-height:1.45}
.reason{display:block;font-size:13px;color:var(--soft);line-height:1.45}
.reason b{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:12px}
.bar{height:9px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;width:110px;margin-top:6px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--red)}
.empty{padding:34px;text-align:center;color:var(--soft);font-family:var(--mono);font-size:13px}
footer{margin-top:54px;border-top:2px solid var(--ink);padding-top:16px;font-family:var(--mono);font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--soft)}
.btn{font-family:var(--mono);font-size:13px;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:9px 18px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);display:inline-block;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn.primary{background:var(--yellow)}
code{font-family:var(--mono);font-size:.9em;background:#F3EFE3;padding:1px 5px;border-radius:4px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:640px){main{padding:0 16px 60px}.tiles{grid-template-columns:repeat(2,1fr)}.hero p{font-size:17px}.head{margin-top:36px}.panel.pad{padding:16px 16px 14px}.math{padding:16px 16px;font-size:13.5px}.math .l{padding-left:0;text-indent:0;margin:8px 0}.math .lab{width:auto;display:block;line-height:1.3;margin-bottom:2px}tr.detail dl{grid-template-columns:1fr}.rule{max-width:260px}td,th{padding:10px 10px}}
</style>
</head>
<body>
<div class="switch-bar"><nav class="switch" aria-label="Section"><a href="news.html">News</a><a href="index.html" class="on" aria-current="page">Index</a></nav></div>
<main id="app"><div class="empty">Loading the methodology…</div></main>
<script>
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString();
const pct=n=>n==null?'—':n<0.001&&n>0?(n*100).toPrecision(2)+'%':(n*100).toFixed(1)+'%';
const ms=n=>n==null?'—':n>=1000?(n/1000).toFixed(2)+' s':Math.round(n)+' ms';
const size=n=>n==null?'—':n>=1e9?(n/1e9).toFixed(n>=1e10?0:1)+'B':n>=1e6?(n/1e6).toFixed(0)+'M':String(n);
const one=n=>n==null?'—':Number(n).toFixed(1);
const KINDC={'inference technique':'k-tech','full fine-tune':'k-full','fine-tune':'k-full','LoRA':'k-lora','LoRA + head':'k-lora','head / adapter':'k-head'};
let D=null;
const sortState={key:'id',dir:'asc'};
const areaOf=id=>D.index.areas.find(a=>a.id===id)||{};
const link=s=>s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name);

function benchSorted(){
 const k=sortState.key,dir=sortState.dir==='asc'?1:-1;
 const val=b=>k==='id'?b.id:k==='dataset'?b.dataset:k==='area'?(b.area_label||''):k==='metric'?(b.metric||''):k==='cases'?b.cases:k==='random'?b.random_baseline.value:k==='panel'?(b.in_panel?1:0):b[k];
 return D.benchmarks.slice().sort((a,b)=>{const x=val(a),y=val(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return typeof x==='string'?dir*x.localeCompare(y):dir*(x-y)});
}
function benchDetail(b){
 const rows=[];
 const add=(k,v)=>{if(v!=null&&v!=='')rows.push(`<dt>${esc(k)}</dt><dd>${v}</dd>`)};
 add('What it asks',esc(b.explainer));
 add('Kind',esc(b.kind)+(b.in_reproduction_suite?' · in the reproduction suite':' · Jev only'));
 add('Origin',esc(b.origin));
 add('Adaptation',b.adaptation.class?`<b>${esc(b.adaptation.class)}</b> — ${esc(b.adaptation.class_description||'')}<br>${esc(b.adaptation.reason||'')}${b.adaptation.candidate_origin?`<br><span class="muted">Candidates: ${esc(b.adaptation.candidate_origin)}</span>`:''}`:null);
 add('Suite category',b.suite_category?esc(b.suite_category)+(b.subcategory?' · '+esc(b.subcategory):''):null);
 add('Counts',[b.source_cases!=null?`${fmt(b.source_cases)} source cases`:null,b.cases!=null?`${fmt(b.cases)} selected`:null,b.requests!=null?`${fmt(b.requests)} requests`:null,b.fields!=null?`${fmt(b.fields)} decisions`:null,b.unit?`unit: ${esc(b.unit)}`:null].filter(Boolean).join(' · '));
 add('Source filtering',esc(b.source_filtering));
 add('Scoring',esc(b.scoring_metric));
 add('Random baseline',b.random_baseline.value!=null?`${pct(b.random_baseline.value)} · ${esc(b.random_baseline.label||'')} (${esc(b.random_baseline.method||'')})${b.random_baseline.monte_carlo_standard_error!=null?` · MC s.e. ${b.random_baseline.monte_carlo_standard_error}`:''}<br><span class="muted">${esc(b.random_baseline.explanation||'')}</span>${b.random_baseline.secondary_reference?`<br><span class="muted">Secondary reference: ${esc(b.random_baseline.secondary_reference.label)} ${pct(b.random_baseline.secondary_reference.value)}</span>`:''}`:(b.random_baseline.explanation?esc(b.random_baseline.explanation):'not measured'));
 if(b.tracks&&b.tracks.length)add('Tracks',`<ul style="margin:0;padding-left:18px">${b.tracks.map(t=>`<li><b>${esc(t.label||t.track)}</b>${t.headline?' <span class="pill yes">headline</span>':''}${t.in_index===false?' <span class="pill no">not in index</span>':''} · ${esc(t.metric||'')}${t.random!=null?` · random ${pct(t.random)}`:''}<br><span class="muted">${esc(t.description||'')}</span></li>`).join('')}</ul>`);
 add('Jev',b.jev?`${b.jev.score!=null?(b.lower_is_better?Number(b.jev.score).toFixed(4):pct(b.jev.score)):'—'}${b.jev.metric?' · '+esc(b.jev.metric):''}${b.jev.episodes?` · ${b.jev.episodes} episodes`:''}${b.jev.interval_95?` · 95% ${b.jev.interval_95.map(x=>pct(x)).join('–')} (${esc(b.jev.interval_method||'')})`:''}${b.jev.http_median_ms!=null?` · HTTP median ${ms(b.jev.http_median_ms)}`:''}`:null);
 add('Reference',(b.references||[]).map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.kind)} ↗</a> <span class="mono muted">${esc(r.url.replace(/^https?:\/\//,''))}</span>`).join('<br>')||null);
 add('Sources',(b.sources||[]).map(s=>link(s)+(s.revision?` <span class="mono muted">@${esc(s.revision.slice(0,10))}</span>`:'')).join('<br>')||'<span class="muted">not recorded</span>');
 add('Licence',(b.licences||[]).length?b.licences.map(l=>`<b>${esc(l.licence)}</b> <span class="muted">· ${esc(l.source)}${l.file?' · '+esc(l.file):''}</span>`).join('<br>'):'<span class="muted">not recorded in the archive</span>');
 add('Index rule',b.index_rule?esc(b.index_rule):(b.left_out_of_index?(b.index_note?esc(b.index_note):'left out of this edition\'s index; still shown on the leaderboard'):null));
 add('Note',esc(b.note));
 add('Comparability',esc(b.comparability_note));
 if(b.protocol)add('Protocol',Object.entries(b.protocol).filter(([k])=>k!=='budget').map(([k,v])=>`<b>${esc(k)}</b>: ${esc(v)}`).join('<br>'));
 return `<dl>${rows.join('')}</dl>`;
}
function benchTable(){
 const th=(k,l,cls='')=>`<th class="sort ${cls}" data-key="${k}" ${sortState.key===k?`data-dir="${sortState.dir}"`:''}>${l}</th>`;
 const body=benchSorted().map(b=>{const a=areaOf(b.area);
  return `<tr class="bench" data-id="${b.id}"><td class="r"><span class="mono">${b.id}</span></td>
  <td><div class="bm"><span class="swatch" style="background:${esc(b.area_color||'#bbb')}"></span>${esc(b.dataset)}${b.kind!=='static'?` <small>${esc(b.kind)}</small>`:''}</div><div class="bm-sub">${esc(b.explainer||'')}</div></td>
  <td><span class="mono">${esc(b.area_label||a.label||'—')}</span>${b.area==='games'?'<span class="mono muted" style="display:block;font-size:11px">folded into Knowledge</span>':''}</td>
  <td class="rule">${esc(b.metric||'')}${b.lower_is_better?' <span class="pill no">lower better</span>':''}</td>
  <td class="r"><span class="mono">${fmt(b.cases)}</span>${b.requests&&b.requests!==b.cases?`<span class="mono muted" style="display:block;font-size:11px">${fmt(b.requests)} req</span>`:''}</td>
  <td class="subset">${esc(b.subset_rule||'')}</td>
  <td class="r"><span class="mono">${b.random_baseline.value!=null?pct(b.random_baseline.value):'—'}</span>${b.random_baseline.method?`<span class="mono muted" style="display:block;font-size:11px">${esc(b.random_baseline.method)}</span>`:''}</td>
  <td>${b.in_panel?`<span class="pill yes">in index</span>${b.gold?' <span style="color:#E0A800" title="gold, weight 1.2">★</span>':''}`:b.dropped_interactive?'<span class="pill no">panel · not run</span>':'<span class="pill no">shown only</span>'}</td></tr>
  <tr class="detail" data-for="${b.id}" hidden><td colspan="8">${benchDetail(b)}</td></tr>`}).join('');
 return `<div class="table-scroll"><table id="benchtable"><thead><tr>${th('id','#','r')}${th('dataset','benchmark')}${th('area','area')}${th('metric','metric')}${th('cases','cases','r')}<th>subset rule</th>${th('random','random baseline','r')}${th('panel','in index')}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function excludedTable(){
 const e=D.excluded_questions;
 const rules=e.rules.map(r=>`<tr><td><span class="mono">${esc(r.reason)}</span></td><td class="r"><span class="mono">${fmt(r.n)}</span></td><td class="rule" style="max-width:520px">${esc(r.rule)}${r.datasets?`<br><span class="muted">${Object.entries(r.datasets).map(([k,v])=>`${esc(k)} ${fmt(v)}`).join(' · ')}</span>`:''}${r.engines_measured?`<br><span class="muted">${r.engines_measured} sweeps measured: ${r.engines_answering_none} answer none of these rows, ${r.engines_answering_all} answer all</span>`:''}</td></tr>`).join('');
 const by=e.by_dataset_and_reason.map(r=>`<tr><td>${esc(r.dataset)} <span class="mono muted">#${r.catalog_id}</span></td><td><span class="mono">${esc(r.reason)}</span></td><td class="r"><span class="mono">${fmt(r.n)}</span></td></tr>`).join('');
 const keep=Object.entries(e.deliberately_not_excluded||{}).map(([k,v])=>`<li><b>${esc(k)}</b>: ${esc(v)}</li>`).join('');
 return `<div class="panel pad prose"><p>${esc(e.purpose)}</p><p class="note">${esc(e.criterion)} ${esc(e.frozen_corpus)} ${esc(e.provenance)}</p></div>
 <div class="panel" style="margin-top:14px"><div class="table-scroll"><table><thead><tr><th>reason</th><th class="r">rows</th><th>rule</th></tr></thead><tbody>${rules}</tbody></table></div></div>
 <div class="grid2" style="margin-top:14px"><div class="panel"><div class="table-scroll"><table><thead><tr><th>dataset</th><th>reason</th><th class="r">rows</th></tr></thead><tbody>${by}</tbody></table></div></div>
 <div class="card"><h3>Deliberately kept</h3><ul style="margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--soft)">${keep}</ul></div></div>`;
}

 <div class="hero"><h1>Methodology · <mark>Index ${esc(num)}</mark></h1>
  <p>Everything needed to audit the Decision Index: the frozen suite, every benchmark's subset rule and random baseline, the formula, the rules every entrant plays by, how entrants are classified, and how latency is measured.</p>

  <nav class="toc" aria-label="Sections"><a href="#v03">New in 0.3</a><a href="#what">What it is</a><a href="#suite">The suite</a><a href="#benchmarks">Benchmarks</a><a href="#formula">Formula</a><a href="#rules">Rules</a><a href="#entrants">Entrants</a><a href="#latency">Latency</a><a href="#gaps">Unanswered</a><a href="#changelog">Changelog</a>${D.notes?'<a href="#notes">Edition notes</a>':''}<a href="#reproduce">Reproduce</a></nav></div>

 <div class="head" id="v03"><h2>New in 0.3: private tests</h2></div>
 <div class="panel pad prose">
  <p>Version 0.3 adds private tests. Most public tasks have a private counterpart that tests an equivalent competence, built from fresh data and kept private, so no model can have trained on it. A further group of private tasks from new decision domains checks that a model's skill reaches beyond the task types on the public board.</p>
  <p>The public index is rebuilt for 0.3: GSM8K is rebuilt, ForecastBench is retired and WinoGrande now counts under Knowledge &amp; Reasoning. Every entrant and Jev is run on the private tests and the new-domain private tasks.</p>
  <code class="note" style="display:block">Full score = 0.20 × public + 0.50 × private set for same skill + 0.30 × new-domain private tasks, each part on the public scale</code>
  <p><b>Why these weights.</b> Half the score comes from private tests of the same skills, because that is the part nobody can train on. Almost a third comes from new-domain private tasks, which reward skill that carries beyond the board. The public benchmarks keep a fifth: they are the shared reference everyone can inspect.</p>
  <p><b>One scale.</b> The three parts spread models out differently, so their raw points are not the same unit. Each part is mapped onto the public scale using the untuned stock models we run as bases: a model one spread above the stock average on the private tests gets the score one spread above the stock average on the public benchmarks. The mapping is the same for every model and never changes the order within a part.</p>
  <p>Most of the score comes from tests nobody can train on, so a public-only advantage counts for little.</p>
  <p><b>Ties.</b> Models within 0.9 points of the first model in their group share a rank, shown as =n; the next group takes the next number, so ranks count groups, not models. That is the gap a fresh sample of the same kinds of questions could produce, 95% of the time, for two neighbouring models on this board.</p>
  <p>The "Public only" switch re-sorts the board by the public index.</p>
  <p><b>Vision board</b> (the Vision switch on the index): Full score = 0.5 × public vision benchmarks + 0.5 × the private set for same skill, as chance-corrected skill × 100. The private vision tasks are harder, and stronger models drop more; a stock VLM, Qwen3-VL-8B, drops more than any fine-tune, so a drop alone does not show overfitting. SigLIP 2, an image-text similarity model with no language model, scores near zero, which shows the tasks need a VLM.</p>
  <p>The sections below describe the public suite that the public index is built on.</p>
 </div>
 <div class="head" id="vision-score"><h2>Vision score — public + private benchmarks</h2></div>
 <div class="panel pad"><div class="vsgrid"><figure class="vsfig"><figcaption>Public vs private set for same skill</figcaption><div id="mvscatter"></div><p class="vsnote">Each dot is a model. On the dashed line, it scores the same on both. References are darker.</p></figure>
  <div class="prose"><p>Every vision task with a "+" has a private task that measures an equivalent competence. The Full score is half the public vision benchmarks and half the private set.</p>
  <p>Every model, stock or fine-tuned, scores lower on the private set: the private tasks are harder, and stronger models drop more. <a href="index.html?mode=vision#learn">Learn more on the vision board →</a></p></div></div></div>

 <div class="head" id="what"><h2>What the Decision Index is</h2></div>
 <div class="panel pad prose">
  <p>The Decision Index is one number per model for how well an open reproduction of TypeSafe's Jev makes typed decisions: pick an option, a label, a tool, a ranking, a probability. Every entrant faces the same frozen suite of ${fmt(s.requests)} requests across ${s.static_benchmarks} static benchmarks, ${subset?'a fixed subset of the':'the exact'} request set Jev ${esc(s.jev_version)} was scored on, with Jev's answers recorded once and never re-run.${note?' '+esc(note):''}</p>
  <p>The index averages ${i.panel} ${i.panel_change?'':'of those '}benchmarks in ${i.areas_count} ${i.weights?'weighted':'equal-weight'} capability areas. Each benchmark keeps its own primary metric, and a request the model could not answer counts as wrong, so the number rewards breadth and honesty over cherry-picking.${i.shown==='balanced_skill'?' Every benchmark is chance-corrected before averaging, so 0 means random guessing and 100 means perfect.':''} It is a point estimate on a fixed panel; nothing is tuned to the entrants${i.panel_change?'. '+esc(i.panel_change):', and the weights do not move between editions.'}</p>
  <p class="note">Formally: ${esc(i.functions.category)} per area, ${esc(i.formulas[0].formula)} for the index, on the ${i.frozen_panel_id?'':'frozen '}panel <code>${esc(i.panel_id)}</code>. ${i.shown==='balanced_skill'?'The index is the chance-corrected score; raw accuracy is shown alongside it and the breadth variant is computed and hidden (below).':'Two chance-normalized variants are computed and hidden (below).'}</p>
 </div>

 ${(D.added_benchmarks||[]).length?`<div class="head" id="added" style="margin-top:26px"><h3 style="font-family:var(--display);font-weight:400;font-size:22px">Added in this edition</h3><p>${fmt(D.added_benchmarks.reduce((a,b)=>a+(b.requests||0),0))} more requests, ${D.added_benchmarks.every(b=>b.in_panel)?'all of them in the index panel; every entrant on the board has results on each one.':'scored outside the index panel for now: which of them become canonical is decided once every entrant\'s results are in. An entrant without results for one is shown as pending, not zero.'}</p></div>
 <div class="panel"><div class="table-scroll"><table><thead><tr><th>benchmark</th><th>area</th><th class="r">requests</th><th>metric</th><th class="r">chance</th><th class="r">Jev</th><th>framing</th><th>licence</th></tr></thead><tbody>${D.added_benchmarks.map(b=>`<tr><td><b>${esc(b.name)}</b><br><span class="f">${esc(b.dataset||'')}</span>${(b.references||[]).map(r=>`<br><a class="f" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.kind)} ↗</a>`).join('')}</td><td>${esc(b.area)}</td><td class="r">${fmt(b.requests)}</td><td>${esc(b.metric||'')}</td><td class="r">${b.chance==null?'—':b.chance.toFixed(3)}</td><td class="r">${b.jev==null?'—':b.jev.toFixed(3)}</td><td style="max-width:420px">${esc(b.framing||'').replace(/`([^`]+)`/g,'<code>$1</code>')}</td><td>${esc(b.licence||'')}</td></tr>`).join('')}</tbody></table></div></div>`:''}

 <div class="head" id="benchmarks"><h2>Benchmark table</h2><p>One row per benchmark: the ${s.static_benchmarks} in the reproduction suite plus the Jev-only calibration extras and interactive environments. Click a row for sources, licence, adaptation and baseline detail; sort any column.</p></div>
 <div class="panel">${benchTable()}</div>
 <p class="note">Adaptation classes: ${Object.entries(s.adaptation_classes).map(([k,v])=>`<b>${esc(k)}</b> — ${esc(v)}`).join(' ')} ${esc(s.licence_caveat)}</p>

 <div class="head" id="formula"><h2>Index formula</h2><p>Exactly as implemented in <code>build_leaderboard.py</code> over <code>compute_indices.py</code>.</p></div>
 ${mathBlock()}
 <div class="panel pad prose" style="margin-top:14px"><ol>${i.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
 ${areaCards()}
 ${chanceSection()}
 ${rescoredSection()}
 ${workedExample()}
 <div class="panel pad prose" style="margin-top:14px"><h3>Clarifications recorded with the index computation</h3><ul>${i.clarifications.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <h3>Frontier comparison</h3><p>${esc(i.frontier_comparison.note)} ${i.frontier_comparison.excluded.map(x=>`<b>${esc(x.name)}</b>: ${esc(x.why)}`).join(' ')}</p>
  <p class="note">Failure policy: ${Object.entries(i.failures).map(([k,v])=>`${esc(k)} → ${esc(v)}`).join('; ')}. Coverage denominator: ${esc(i.coverage.denominator)}. Uncertainty: ${esc(i.uncertainty.method)} (${i.uncertainty.replicates} replicates, ${i.uncertainty.confidence_level*100}%), not yet computed. Hashes: proposal ${esc((i.hashes.panel_proposal_sha256||'').slice(0,12))}…, corpus ${esc((i.hashes.static_corpus_sha256||'').slice(0,12))}…, baselines ${esc((i.hashes.random_baselines_sha256||'').slice(0,12))}….</p></div>

 <div class="head" id="rules"><h2>Rules of the game</h2><p>Every entrant runs as published, on the whole suite, and is scored against the full denominator.</p></div>
 ${rulesSection()}

 <div class="head" id="entrants"><h2>How entrants are classified</h2><p>Whether a number came from new weights or from a decoding technique wrapped around a stock checkpoint is a different claim, so every row says which.</p></div>
 ${entrantSection()}

 <div class="head" id="latency"><h2>Latency</h2><p>Two different clocks: in-process GPU time for the reproductions, an HTTP round trip for Jev.</p></div>
 ${latencySection()}

 <div class="head" id="gaps"><h2>Why models did not answer everything</h2><p>Share of the ${fmt(s.requests)} requests each model produced a valid typed answer for, and what stopped the rest.</p></div>
 ${gapsSection()}

 <div class="head" id="changelog"><h2>Changelog</h2></div>
 <div class="panel pad prose">${D.changelog.map(c=>`<h3>Edition ${esc(c.edition)} · ${esc(c.date)}</h3><ul>${c.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div>

 ${notesSection()}

 <div class="head" id="reproduce"><h2>Reproduce it</h2></div>
 <div class="panel pad prose">
  <p>The runner, scorers, index computation and this page's data build live in the open at <a href="${esc(D.reproduce.github)}" target="_blank" rel="noopener">${esc(D.reproduce.github.replace('https://',''))}</a>. Run an entrant on the frozen corpus with <code>run.py</code>, score it with <code>report_model.py</code>, mine its refusals with <code>answer_gaps.py</code>, recompute the panel with <code>compute_indices.py</code>, and rebuild <code>data/index.json</code> and <code>data/methodology.json</code> with <code>build_leaderboard.py</code> and <code>build_methodology.py</code>. The corpus, chance baselines, panel proposal and exclusion manifest are pinned by sha256 in the JSON above, so a re-run that changes any of them announces itself.</p>
  <p style="margin-top:14px"><a class="btn primary" href="${esc(D.reproduce.github)}" target="_blank" rel="noopener">GitHub · apolinario/decision-index ↗</a> <a class="btn" href="index.html">Back to the index</a></p>
 </div>
 <footer><span>frozen suite · ${fmt(s.requests)} requests · ${s.static_benchmarks} benchmarks · ${esc(hw)}</span><span>Not affiliated with TypeSafe AI · <a href="index.html">Decision Index ${esc(num)}</a> · <a href="news.html">news &amp; artifacts</a></span></footer>`;
 wire();
}
function wire(){
 const t=$('#benchtable');if(!t)return;
 t.addEventListener('click',e=>{
  const th=e.target.closest('th.sort');
  if(th){const k=th.dataset.key;if(sortState.key===k)sortState.dir=sortState.dir==='asc'?'desc':'asc';else{sortState.key=k;sortState.dir=k==='id'||k==='dataset'||k==='area'||k==='metric'?'asc':'desc'}
   t.parentElement.parentElement.innerHTML=benchTable();wire();return}
  const tr=e.target.closest('tr.bench');
  if(tr&&!e.target.closest('a')){const d=t.querySelector(`tr.detail[data-for="${tr.dataset.id}"]`);if(d)d.hidden=!d.hidden}
 });
}
const MVK={'full fine-tune':'#A855F7','LoRA':'#3E8E5E','LoRA + head':'#3E8E5E','head / adapter':'#FF9D00','inference technique':'#3B7CF6'};
const MVR={'ref-qwen35-397b':'#232323','ref-qwen3vl-8b':'#55524B','ref-siglip2':'#8C8C8C'};
function drawMV(V){
 const host=document.getElementById('mvscatter');if(!host||!V)return;
 const rows=V.entrants.concat(V.refs),W=600,H=420,L=48,R=16,T=12,B=44,hi=Math.ceil(Math.max(...rows.map(r=>Math.max(r.pub,r.priv)))/10)*10;
 const px=v=>L+v/hi*(W-L-R),py=v=>T+(hi-v)/hi*(H-T-B),e=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 let g='';for(let v=0;v<=hi;v+=10)g+=`<line x1="${L}" x2="${W-R}" y1="${py(v)}" y2="${py(v)}" stroke="#E1DCD0"/><text x="${L-8}" y="${py(v)+4}" class="mvax" text-anchor="end">${v}</text><text x="${px(v)}" y="${H-B+16}" class="mvax" text-anchor="middle">${v}</text>`;
 g+=`<line x1="${px(0)}" y1="${py(0)}" x2="${px(hi)}" y2="${py(hi)}" stroke="#232323" stroke-width="1.4" stroke-dasharray="5 4"/>`;
 const lab=[];
 for(const r of rows.slice().sort((a,b)=>(a.ref?1:0)-(b.ref?1:0))){const cx=px(r.pub),cy=py(r.priv),c=r.ref?MVR[r.engine]:(MVK[r.kind]||'#bbb');
  g+=`<circle cx="${cx}" cy="${cy}" r="${r.ref?7:5}" fill="${c}" stroke="#232323" stroke-width="1.5"><title>${e(r.name)} · public ${r.pub.toFixed(1)} · private ${r.priv.toFixed(1)}</title></circle>`;
  if(r.ref||r.rank_full===1)lab.push(`<text x="${cx+(r.engine==='ref-siglip2'?10:-10)}" y="${cy+(r.ref?16:-10)}" class="mvlab" text-anchor="${r.engine==='ref-siglip2'?'start':'end'}">${e(r.name)}</text>`)}
 const nt=document.getElementById('mvnotes');if(nt)nt.innerHTML=V.entrants.filter(r=>r.caveat).map(r=>`<li><b>${e(r.name)}</b>: ${e(r.caveat)}</li>`).join('')+`<li><b>Not on the vision board</b>: ${V.excluded.map(x=>e(x.name)+' ('+e(x.why)+')').join('; ')}.</li>`;
 host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Public vision score against private set score">${g}${lab.join('')}<text x="${L}" y="${H-4}" class="mvax">public vision score →</text><text class="mvax" text-anchor="middle" transform="translate(12,${(H-B+T)/2}) rotate(-90)">private set for same skill ↑</text></svg>`;
}
fetch('data/methodology.json?v='+Math.floor(Date.now()/6e5)).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{D=d;render();fetch('data/vision.json?v='+Math.floor(Date.now()/6e5)).then(r=>r.ok?r.json():null).then(drawMV).catch(()=>{});if(location.hash){const el=document.querySelector(location.hash);if(el)el.scrollIntoView()}}).catch(err=>{$('#app').innerHTML=`<p class="empty">Could not load data/methodology.json (${esc(err.message)}).</p>`});
</script>
</body>
